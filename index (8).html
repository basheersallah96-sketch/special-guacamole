<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيّاد الأصوات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7cc4dc">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfe6f0;--bg2:#7cc4dc;--card:#ffffff;--ink:#12355b;--soft:#4a6b8a;--sun:#ffc93c;--ok:#1f9d5c;--bad:#e5484d;--btn:#12355b;--btnink:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2338;--bg2:#0f4a66;--card:#14304a;--ink:#eaf6fb;--soft:#9fc3d8;--ok:#43d18a;--bad:#ff7a7f;--btn:#ffc93c;--btnink:#12355b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b2338;--bg2:#0f4a66;--card:#14304a;--ink:#eaf6fb;--soft:#9fc3d8;--ok:#43d18a;--bad:#ff7a7f;--btn:#ffc93c;--btnink:#12355b;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;font-family:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2));display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:16px 14px 28px;display:flex;flex-direction:column;gap:12px}
h1{font-size:32px;margin:4px 0 0;font-weight:800;line-height:1.2}
p{margin:0;line-height:1.7;font-size:17px}
.soft{color:var(--soft);font-size:15px}
.card{background:var(--card);border-radius:28px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
button{font:inherit;font-weight:700;font-size:19px;border:0;border-radius:999px;padding:12px 24px;background:var(--btn);color:var(--btnink);cursor:pointer;min-height:50px}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--soft)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.L{position:relative;font-size:38px;font-weight:800;padding:8px 0;border-radius:20px;background:var(--bg);color:var(--ink);min-height:68px;line-height:1.2}
.L i{position:absolute;bottom:2px;left:0;right:0;font-size:11px;font-style:normal;letter-spacing:1px}
.pos{display:flex;flex-direction:column;gap:10px;width:100%}
.pos button{display:flex;justify-content:space-between;align-items:center;border-radius:22px;width:100%;padding:14px 20px}
.pos span{font-size:15px;opacity:.8}
.bar{height:12px;border-radius:9px;background:var(--card);overflow:hidden;width:100%}
.bar div{height:100%;background:var(--ok);width:0;transition:width .4s}
.top{display:flex;align-items:center;gap:10px}
.top button{padding:6px 16px;min-height:40px;font-size:16px}
.emoji{font-size:84px;line-height:1.1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.word{font-size:46px;font-weight:800;line-height:1.2}
.word b{color:var(--bad);font-weight:800}
.chip{font-size:15px;color:var(--soft);background:var(--bg);border-radius:999px;padding:2px 14px}
button.mic,button.mic2{width:84px;height:84px;border-radius:50%;font-size:38px;padding:0;background:var(--bad);color:#fff}
button.mic2{background:var(--btn);color:var(--btnink)}
.duo{display:flex;gap:30px;justify-content:center;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--soft)}
.ib{padding:6px 14px!important;min-height:40px!important;font-size:16px!important}
.g3{gap:8px;padding:14px 12px}
.emoji img{width:130px;height:130px;object-fit:cover;border-radius:22px}
.sp{width:100%;font-size:14px;color:var(--soft)}
.sp summary{padding:6px;cursor:pointer}
.stk{position:sticky;top:0;background:var(--card);z-index:3;padding:6px 0 8px;display:flex;flex-direction:column;border-radius:20px}
#spec{font-size:15px;min-height:40px;padding:8px 18px}
button.mic.live,button.mic2.live{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(229,72,77,.25)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.msg{min-height:54px;font-size:19px;font-weight:700}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.tip{background:var(--bg);border-radius:18px;padding:10px 14px;font-size:16px;text-align:right;width:100%}
.gh:empty{display:none}
#fishes{display:flex;flex-wrap:wrap;gap:2px;font-size:22px;line-height:1.1;flex:1;align-items:center}
.gh{align-self:flex-start;font-size:21px;font-weight:800;margin-top:6px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.gb{background:var(--bg);color:var(--ink);border-radius:20px;padding:12px 8px;font-size:17px;line-height:1.5}
.rr{display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bg);font-size:18px}
.rr button{padding:6px 12px;min-height:40px;font-size:16px}
select{font:inherit;font-size:18px;padding:10px;border-radius:14px;width:100%;background:var(--bg);color:var(--ink);border:0}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.ci{background:var(--bg);color:var(--ink);border-radius:16px;padding:8px 2px;font-size:15px;line-height:1.3;min-height:0;border:3px solid transparent;font-weight:700}
.ci span{display:block;font-size:34px;line-height:1.2}
.ci.on{border-color:var(--ok)}
.hide{display:none!important}
.note{font-size:13px;color:var(--soft);text-align:center;line-height:1.6}
.stars{font-size:52px;letter-spacing:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
 <section id="s1" class="card">
  <h1>صيّاد الأصوات 🐠</h1>
  
  <div class="row"><button id="tS">🔤 حسب الصوت</button><button class="ghost" id="tG">📦 حسب المجموعة</button></div>
  <div class="grid" id="grid"></div>
  <div id="ggrid" class="hide" style="width:100%"></div>
  <button class="ghost" id="spec">🎙️ وضع الأخصائي</button>
 </section>

 <section id="s2" class="hide">
  <div class="card">
   <div class="top"><button class="ghost" id="b2">رجوع</button></div>
   <h1 id="bigL"></h1>
   <p class="soft">وين بدك الصوت بالكلمة؟</p>
   <div class="pos" id="pos"></div>
  </div>
 </section>

 <section id="s3" class="hide">
  <div class="top"><button class="ghost ib" id="b3" aria-label="خروج">✕</button><button class="ghost ib" id="snd">🔊</button><div id="fishes"></div></div>
  <div class="card g3" style="margin-top:8px">
   <div class="chip" id="chip"></div>
   <div class="emoji" id="emoji"></div>
   <div class="word" id="word"></div>
   <div class="row"><button class="ghost ib" id="hear">🔊 اسمعها</button><button class="ghost ib hide" id="replay">▶ صوتي</button><button class="ghost" id="hearL" style="display:none!important">🔤</button></div>
   <div class="duo" id="duo">
    <div class="col"><button class="mic" id="mic" aria-label="احكي">🎤</button>احكي</div>
    <div class="col"><button class="mic2" id="mine" aria-label="سمّعني صوتي">🎧</button>سمّعني صوتي</div>
   </div>
   <div class="msg" id="msg"></div>
   <div class="soft" id="heard"></div>
   <div class="soft" id="rhint"></div>
   <div class="tip hide" id="tip"></div>
   <div class="row hide" id="manual">
    <button id="yes" style="background:var(--ok);color:#fff">قلتها صح ✓</button>
    <button id="again" class="ghost">بعيدها</button>
   </div>
   <button id="next" class="hide">الكلمة الجاية</button>
   <button class="ghost hide" id="redo">🔁 أعيد الكلمة</button>
   <details class="sp"><summary>🛠️ أدوات الأخصائي</summary><div class="row"><button class="ghost ib" id="rw">⏺ تسجيل الأخصائي</button><button class="ghost ib" id="rimg">📷 صورة للكلمة</button></div></details>
  </div>
 </section>

 <section id="s6" class="hide">
  <div class="card" style="align-items:stretch;gap:8px">
   <div class="stk">
    <div class="top"><button class="ghost ib" id="b6">رجوع</button><h1 id="gtitle" style="font-size:22px;margin:0"></h1></div>
    <button id="goG" style="width:100%;margin-top:8px">ابدأ التدريب</button>
    <div class="row" style="margin-top:8px"><button class="ghost ib" id="selAll">تحديد الكل</button><button class="ghost ib" id="selNone">إلغاء الكل</button></div>
   </div>
   <div class="cg" id="cg"></div>
  </div>
 </section>

 <section id="s5" class="hide">
  <div class="card" style="align-items:stretch">
   <div class="top"><button class="ghost" id="b5">رجوع</button></div>
   <h1>تسجيل صوت الأخصائي</h1>
   <p class="soft">سجّل بصوتك وبيصير هو اللي بينطق للطفل بدل صوت الجهاز. التسجيلات بتنحفظ على هالجهاز بس.</p>
   <select id="rsel"></select>
   <div class="msg" id="rmsg"></div>
   <div id="rlist" style="width:100%"></div>
  </div>
 </section>

 <section id="s4" class="card hide">
  <div class="stars" id="stars"></div>
  <h1>برافو!</h1>
  <p id="sum"></p>
  <div class="row"><button id="again2">نعيد</button><button class="ghost" id="home">القائمة</button></div>
 </section>

 <p class="note">نموذج أولي للتجربة. التعرف على الصوت تقريبي ولا يغني عن تقييم أخصائي نطق.</p>
</main>

let gmode=false,gj=0,selW=new Set(),have=new Set(),haveImg=new Set(),recCtl=null,curA=null;
const DBP=new Promise((res,rej)=>{try{const q=indexedDB.open('sayyad',1);q.onupgradeneeded=()=>q.result.createObjectStore('v');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
async function dbx(m,k,v){try{const d=await DBP;return await new Promise(r=>{const s=d.transaction('v',(m==='get'||m==='keys')?'readonly':'readwrite').objectStore('v');const q=m==='get'?s.get(k):m==='put'?s.put(v,k):m==='del'?s.delete(k):s.getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function loadHave(){const k=(await dbx('keys'))||[];have=new Set(k.filter(x=>!String(x).startsWith('img:')));haveImg=new Set(k.filter(x=>String(x).startsWith('img:')).map(x=>x.slice(4)))}
function playBlob(b){return new Promise(r=>{try{if(curA)curA.pause();const a=new Audio(URL.createObjectURL(b));curA=a;a.onended=r;a.onerror=r;a.play().catch(r)}catch(e){r()}})}
async function sayKey(k,t,rate){try{speechSynthesis.cancel()}catch(e){}if(curA)curA.pause();if(have.has(k)){const b=await dbx('get',k);if(b)return playBlob(b)}return speak(t,rate||.8,true)}
const sayWord=w=>sayKey(w,w,.6);
async function recStart(){const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st),ch=[];let pk=0,ac2=null,iv=0;try{ac2=new(window.AudioContext||window.webkitAudioContext)();const an=ac2.createAnalyser();an.fftSize=512;ac2.createMediaStreamSource(st).connect(an);const bf=new Uint8Array(512);iv=setInterval(()=>{an.getByteTimeDomainData(bf);for(const v of bf)pk=Math.max(pk,Math.abs(v-128))},80)}catch(e){pk=99}mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};const done=new Promise(r=>{mr.onstop=()=>{clearInterval(iv);try{ac2&&ac2.close()}catch(e){}st.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:mr.mimeType||'audio/webm'});b.peak=pk;r(b)}});mr.start();return{stop:()=>{mr.stop();return done}}}
let attempt=null,recTk=0,lastRec=null;
function fishDots(){$('fishes').innerHTML=wins?'🐟'.repeat(wins)+' <small>'+wins+'</small>':'<small style="color:var(--soft);font-size:14px">كل ما تحكي صح بتنضاف سمكة 🐟</small>'}
function beginRec(){}
async function endRec(){recTk++;if(!attempt)return;const c=attempt;attempt=null;try{const b=await c.stop();if(b.size>1500&&b.peak>6){lastRec=b;$('replay').classList.remove('hide')}else{$('rhint').textContent='(صوتك ما انسجل مع التعرف على هالجهاز، جرّب زر 🎙️ سمّعني صوتي)'}}catch(e){}}
$('replay').onclick=async()=>{if(!lastRec)return;await playBlob(lastRec);await sayWord(cards[i].w)};
function ggrid(){let k=0;$('ggrid').innerHTML=GR.map(g=>'<div class="gh">'+g[0]+'</div><div class="gg">'+g[1].map(s=>{const j=k++;return '<button class="gb" data-j="'+j+'">'+s[0]+'<br>'+s[1]+'</button>'}).join('')+'</div>').join('');
  $('ggrid').querySelectorAll('.gb').forEach(b=>b.onclick=()=>openG(+b.dataset.j))}
function openG(j){gj=j;const g=GN[j],ws=g.w.filter(w=>E[w]);selW=new Set(ws);$('gtitle').textContent=g.n+' ('+ws.length+')';
  $('cg').innerHTML=ws.map(w=>'<button class="ci on" data-w="'+w+'"><span>'+E[w]+'</span>'+w+'</button>').join('');
  $('cg').querySelectorAll('.ci').forEach(b=>b.onclick=()=>{const w=b.dataset.w;if(selW.has(w)){selW.delete(w);b.classList.remove('on')}else{selW.add(w);b.classList.add('on')}cnt()});cnt();ws.filter(w=>haveImg.has(w)).forEach(w=>dbx('get','img:'+w).then(b=>{const el=$('cg').querySelector('[data-w="'+w+'"] span');if(b&&el)el.innerHTML='<img alt="" src="'+URL.createObjectURL(b)+'" style="width:44px;height:44px;object-fit:cover;border-radius:10px">'}));show('s6')}
function cnt(){$('goG').textContent='ابدأ التدريب ('+selW.size+')';$('goG').disabled=!selW.size}
function startG(){const g=GN[gj],ws=g.w.filter(w=>selW.has(w)&&E[w]);if(!ws.length)return;gmode=true;cards=shuffle(ws.map(w=>({w,e:E[w],p:-1,g:g.n})));i=0;wins=0;score=0;show('s3');$('hearL').classList.add('hide');render()}
$('selAll').onclick=()=>{selW=new Set(GN[gj].w.filter(w=>E[w]));$('cg').querySelectorAll('.ci').forEach(b=>b.classList.add('on'));cnt()};
$('selNone').onclick=()=>{selW=new Set();$('cg').querySelectorAll('.ci').forEach(b=>b.classList.remove('on'));cnt()};
$('goG').onclick=startG;
function setPic(c){const el=$('emoji');el.textContent=c.e;if(haveImg.has(c.w))dbx('get','img:'+c.w).then(b=>{if(b&&cards[i]===c)el.innerHTML='<img alt="" src="'+URL.createObjectURL(b)+'">'})}
function pickImg(k){return new Promise(res=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{const file=f.files[0];if(!file)return res(false);try{const bm=await createImageBitmap(file);const sc=Math.min(1,480/Math.max(bm.width,bm.height));const cv=document.createElement('canvas');cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));await dbx('put','img:'+k,blob);haveImg.add(k);res(true)}catch(e){res(false)}};f.click()})}
$('rimg').onclick=async()=>{if(await pickImg(cards[i].w))setPic(cards[i])};$('b6').onclick=()=>show('s1');
$('rw').onclick=async()=>{const k=cards[i].w;if(recCtl){if(recCtl.k===k){const b=await recCtl.c.stop();recCtl=null;await dbx('put',k,b);have.add(k);$('rw').textContent='⏺ تسجيل الأخصائي ✅';setMsg('انحفظ تسجيلك لهالكلمة ✅','ok')}return}try{recCtl={k,c:await recStart()};$('rw').textContent='⏹ إيقاف التسجيل';setMsg('عم أسجّل… قول الكلمة وبعدين اضغط ⏹','')}catch(e){setMsg('المايك مش متاح','no')}};
$('mine').onclick=async()=>{if(busy)return;busy=true;$('mine').classList.add('live');try{setMsg('عم أسجّل… احكي الكلمة 🎙️','');const c=await recStart();await new Promise(r=>setTimeout(r,3500));const b=await c.stop();$('mine').classList.remove('live');lastRec=b;$('replay').classList.remove('hide');setMsg('هيك سمعت صوتك 👂','');await playBlob(b);setMsg('وهيك بتنقال 🔊','');await sayWord(cards[i].w);setMsg('قلتها متل ما سمعت؟','');$('manual').classList.remove('hide');$('yes').onclick=win}catch(e){$('mine').classList.remove('live');setMsg('المايك مش متاح هلأ','no')}busy=false};
$('tS').onclick=()=>{$('grid').classList.remove('hide');$('ggrid').classList.add('hide');$('tS').classList.remove('ghost');$('tG').classList.add('ghost')};
$('tG').onclick=()=>{$('ggrid').classList.remove('hide');$('grid').classList.add('hide');$('tG').classList.remove('ghost');$('tS').classList.add('ghost')};
const RS=[['p','🎉 عبارات التشجيع']].concat(GN.map((g,j)=>['g'+j,g.n])).concat([...LET].map(c=>['c'+c,'🔤 كل كلمات صوت '+c]));
$('rsel').innerHTML=RS.map(r=>'<option value="'+r[0]+'">'+r[1]+'</option>').join('');
function recItems(v){
  if(v==='p')return PRAISE.map(t=>({k:'__'+t,t,l:t}));
  if(v==='l')return [...LET].map(c=>({k:'L:'+c,t:c+'\u064E',l:'صوت '+c}));
  if(v[0]==='c'){const seen=new Set();return [0,1,2].flatMap(p=>words(v[1],p)).filter(x=>!seen.has(x.w)&&seen.add(x.w)).map(x=>({k:x.w,t:x.w,l:x.e+' '+x.w}))}
  return GN[+v.slice(1)].w.filter(w=>E[w]).map(w=>({k:w,t:w,l:E[w]+' '+w}));
}
function renderRec(){$('rlist').innerHTML=recItems($('rsel').value).map(x=>'<div class="rr"><span>'+(have.has(x.k)?'✅':'')+(haveImg.has(x.k)?'🖼️':'')+' '+x.l+'</span><span><button data-a="r" data-k="'+x.k+'">'+(recCtl&&recCtl.k===x.k?'⏹':'⏺')+'</button> <button class="ghost" data-a="p" data-k="'+x.k+'" data-t="'+x.t+'">▶</button> <button class="ghost" data-a="i" data-k="'+x.k+'">📷</button> <button class="ghost" data-a="d" data-k="'+x.k+'">🗑</button></span></div>').join('')}
$('rsel').onchange=renderRec;
$('rlist').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,a=b.dataset.a;
  if(a==='p')return sayKey(k,b.dataset.t);
  if(a==='i'){await pickImg(k);return renderRec()}
  if(a==='d'){await dbx('del',k);have.delete(k);return renderRec()}
  if(recCtl){if(recCtl.k===k){const blob=await recCtl.c.stop();recCtl=null;await dbx('put',k,blob);have.add(k);$('rmsg').textContent='انحفظ ✅'}return renderRec()}
  try{recCtl={k,c:await recStart()};$('rmsg').textContent='عم أسجّل… اضغط ⏹ لما تخلص';renderRec()}catch(err){$('rmsg').textContent='المايك مش متاح'}};
$('spec').onclick=()=>{renderRec();show('s5')};
$('b5').onclick=()=>show('s1');
$('mic').onclick=listen;
$('hear').onclick=()=>sayWord(cards[i].w);
$('hearL').onclick=()=>sayKey('L:'+L,L+'\u064E',.6);
$('redo').onclick=()=>{redoing=true;['next','redo'].forEach(x=>$(x).classList.add('hide'));$('duo').classList.remove('hide');setMsg('اضغط المايك وأعدها','')};
$('snd').onclick=()=>{snd=!snd;$('snd').textContent=snd?'🔊 صوت':'🔇 صامت';if(!snd){try{speechSynthesis.cancel()}catch(e){}}};
$('yes').onclick=win;
$('again').onclick=()=>{tries++;setMsg('تمام، جرّب مرة ثانية','');tip()};
$('next').onclick=()=>{i===cards.length-1?finish():(i++,render())};
$('b2').onclick=()=>{grid();show('s1')};
$('b3').onclick=()=>{grid();show('s1')};
$('home').onclick=()=>{grid();show('s1')};
$('again2').onclick=()=>gmode?startG(gj):start(mode);
grid();ggrid();loadHave();
if('serviceWorker' in navigator&&!window.Capacitor&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
