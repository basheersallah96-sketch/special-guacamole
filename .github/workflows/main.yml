name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Prepare web files
        run: |
          mkdir -p www
          cp "index (1).html" www/index.html
      - name: Add Android
        run: npx cap add android
      - name: Patch manifest
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $f || sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>#' $f
          grep -q RecognitionService $f || sed -i 's#</manifest>#<queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' $f
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sayyad-alaswat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
