<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيّاد الأصوات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7cc4dc">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfe6f0;--bg2:#7cc4dc;--card:#ffffff;--ink:#12355b;--soft:#4a6b8a;--sun:#ffc93c;--ok:#1f9d5c;--bad:#e5484d;--btn:#12355b;--btnink:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2338;--bg2:#0f4a66;--card:#14304a;--ink:#eaf6fb;--soft:#9fc3d8;--ok:#43d18a;--bad:#ff7a7f;--btn:#ffc93c;--btnink:#12355b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b2338;--bg2:#0f4a66;--card:#14304a;--ink:#eaf6fb;--soft:#9fc3d8;--ok:#43d18a;--bad:#ff7a7f;--btn:#ffc93c;--btnink:#12355b;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;font-family:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2));display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:16px 14px 28px;display:flex;flex-direction:column;gap:12px}
h1{font-size:32px;margin:4px 0 0;font-weight:800;line-height:1.2}
p{margin:0;line-height:1.7;font-size:17px}
.soft{color:var(--soft);font-size:15px}
.card{background:var(--card);border-radius:28px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
button{font:inherit;font-weight:700;font-size:19px;border:0;border-radius:999px;padding:12px 24px;background:var(--btn);color:var(--btnink);cursor:pointer;min-height:50px}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--soft)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.L{position:relative;font-size:38px;font-weight:800;padding:8px 0;border-radius:20px;background:var(--bg);color:var(--ink);min-height:68px;line-height:1.2}
.L i{position:absolute;bottom:2px;left:0;right:0;font-size:11px;font-style:normal;letter-spacing:1px}
.pos{display:flex;flex-direction:column;gap:10px;width:100%}
.pos button{display:flex;justify-content:space-between;align-items:center;border-radius:22px;width:100%;padding:14px 20px}
.pos span{font-size:15px;opacity:.8}
.bar{height:12px;border-radius:9px;background:var(--card);overflow:hidden;width:100%}
.bar div{height:100%;background:var(--ok);width:0;transition:width .4s}
.top{display:flex;align-items:center;gap:10px}
.top button{padding:6px 16px;min-height:40px;font-size:16px}
.emoji{font-size:104px;line-height:1.1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.word{font-size:60px;font-weight:800;line-height:1.2}
.word b{color:var(--bad);font-weight:800}
.chip{font-size:15px;color:var(--soft);background:var(--bg);border-radius:999px;padding:2px 14px}
button.mic{width:104px;height:104px;border-radius:50%;font-size:44px;padding:0;background:var(--bad);color:#fff}
button.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(229,72,77,.25)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.msg{min-height:54px;font-size:19px;font-weight:700}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.tip{background:var(--bg);border-radius:18px;padding:10px 14px;font-size:16px;text-align:right;width:100%}
.hide{display:none!important}
.note{font-size:13px;color:var(--soft);text-align:center;line-height:1.6}
.stars{font-size:52px;letter-spacing:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
 <section id="s1" class="card">
  <h1>صيّاد الأصوات 🐠</h1>
  <p class="soft">اختار الصوت اللي بدك تتدرب عليه</p>
  <div class="grid" id="grid"></div>
 </section>

 <section id="s2" class="hide">
  <div class="card">
   <div class="top"><button class="ghost" id="b2">رجوع</button></div>
   <h1 id="bigL"></h1>
   <p class="soft">وين بدك الصوت بالكلمة؟</p>
   <div class="pos" id="pos"></div>
  </div>
 </section>

 <section id="s3" class="hide">
  <div class="top"><button class="ghost" id="b3">خروج</button><button class="ghost" id="snd">🔊 صوت</button><div class="bar"><div id="fill"></div></div></div>
  <div class="card" style="margin-top:12px">
   <div class="chip" id="chip"></div>
   <div class="emoji" id="emoji"></div>
   <div class="word" id="word"></div>
   <div class="row"><button class="ghost" id="hear">🔊 الكلمة</button><button class="ghost" id="hearL">🔤 الصوت</button></div>
   <button class="mic" id="mic" aria-label="سجّل صوتك">🎤</button>
   <div class="msg" id="msg"></div>
   <div class="tip hide" id="tip"></div>
   <div class="row hide" id="manual">
    <button id="yes" style="background:var(--ok);color:#fff">قلتها صح ✓</button>
    <button id="again" class="ghost">بعيدها</button>
   </div>
   <button id="next" class="hide">الكلمة الجاية</button>
   <button class="ghost hide" id="redo">🔁 أعيد الكلمة</button>
  </div>
 </section>

 <section id="s4" class="card hide">
  <div class="stars" id="stars"></div>
  <h1>برافو!</h1>
  <p id="sum"></p>
  <div class="row"><button id="again2">نعيد</button><button class="ghost" id="home">صوت ثاني</button></div>
 </section>

 <p class="note">نموذج أولي للتجربة. التعرف على الصوت تقريبي ولا يغني عن تقييم أخصائي نطق.</p>
</main>

'ظ':'طرف اللسان بين الأسنان مع صوت تقيل وفم مدور: ظظظ.',
'ص':'مثل س بس بصوت أتخن، ولسانك يرتفع لفوق: صصص.',
'ض':'جانب لسانك يلمس الأضراس العليا، والصوت تقيل: ضضض.',
'ط':'اضغط لسانك على سقف الفم وافلته بقوة: ط.',
'ع':'اضغط حلقك شوي وأطلع صوت من العمق، متل ما بتتثاءب: عععع.',
'غ':'مثل الغرغرة بالمي بس بدون مي: غغغ.',
'خ':'احكّ آخر لسانك بسقف الفم من ورا: خخخ مثل القطة.',
'ح':'انفخ هوا دافي من حلقك متل ما بتنفخ على المراية: حححح.',
'ق':'آخر لسانك يلمس سقف الفم من ورا ويفلت بقوة: ق.',
'ك':'مثل ق بس أقرب لقدام وأخف: ك.',
'ج':'ابدأ بلسانك على سقف الفم وانفلت بصوت: ج.',
'ز':'مثل س بس مع اهتزاز بالحلق، متل صوت النحلة: زززز.',
'ل':'طرف لسانك يلمس اللثة العليا: لللل.'
};
const GEN=['انتبه للحرف الأحمر وقوله بوضوح.','جرّب تقولها ببطء أول مرة.','قول الصوت لحاله أولاً، وبعدين الكلمة كاملة.'];
const PN=['أول الكلمة','وسط الكلمة','آخر الكلمة'];
const $=id=>document.getElementById(id);
const done={};
let L='',cards=[],redoing=false,i=0,tries=0,score=0,wins=0,busy=false,mode=-1,srOK=!!(window.SpeechRecognition||window.webkitSpeechRecognition||nat('SpeechRecognition'));

function norm(s){return (s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim()}
function show(n){['s1','s2','s3','s4'].forEach(x=>$(x).classList.toggle('hide',x!==n))}
function parse(l){return [0,1,2].map(p=>words(l,p))}
function grid(){
  $('grid').innerHTML=[...LET].map(l=>'<button class="L" data-l="'+l+'">'+l+(done[l]?'<i>'+'⭐'.repeat(done[l])+'</i>':'')+'</button>').join('');
  $('grid').querySelectorAll('.L').forEach(b=>b.onclick=()=>pick(b.dataset.l));
}
function pick(l){
  L=l;const g=parse(l);
  $('bigL').textContent='صوت '+l;
  const labels=[...PN,'كل المواقع'];
  $('pos').innerHTML=labels.map((t,k)=>{const n=k<3?Math.min(10,g[k].length):Math.min(10,g[0].length)+Math.min(10,g[1].length)+Math.min(10,g[2].length);return '<button data-k="'+k+'">'+t+'<span>'+n+' بطاقات</span></button>'}).join('');
  $('pos').querySelectorAll('button').forEach(b=>b.onclick=()=>start(+b.dataset.k));
  show('s2');
}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(k){
  mode=k;const g=parse(L);
  const t10=a=>shuffle(a.slice()).slice(0,10);
  cards=k<3?t10(g[k]):shuffle([...t10(g[0]),...t10(g[1]),...t10(g[2])]);
  i=0;wins=0;score=0;show('s3');render();
}
function hiIndex(c){
  const a=[...c.w];
  if(c.p===0)return 0;
  if(c.p===2)return a.length-1;
  for(let k=1;k<a.length-1;k++)if(inL(a[k],L))return k;
  return a.findIndex(c=>inL(c,L));
}
function render(){
  const c=cards[i];tries=0;
  $('emoji').textContent=c.e;
  const h=hiIndex(c);
  $('word').innerHTML=[...c.w].map((ch,k)=>k===h?'<b>'+ch+'</b>':ch).join('');
  $('chip').textContent='الصوت '+L+' · '+PN[c.p];
  $('fill').style.width=(i/cards.length*100)+'%';
  setMsg('اضغط المايك وقل الكلمة','');
  ['tip','next','redo'].forEach(x=>$(x).classList.add('hide'));
  $('manual').classList.toggle('hide',srOK);
  $('mic').classList.remove('hide');
}
function setMsg(t,k){const m=$('msg');m.textContent=t;m.className='msg '+k}
let snd=true,ac=null;
const PRAISE=['برافو','أحسنت'];
let chain=Promise.resolve();
function nat(n){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins[n]}
function speak(t,rate,flush){
  const T=nat('TextToSpeech');
  if(T){
    if(flush){try{T.stop()}catch(e){}chain=Promise.resolve()}
    chain=chain.then(()=>T.speak({text:t,lang:'ar-SA',rate:rate||.8,pitch:1,volume:1,category:'ambient'})).catch(()=>{});
    return;
  }
  try{if(flush)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=rate||.8;speechSynthesis.speak(u)}catch(e){}
}
function tone(f,d,t,type,v){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function chime(){[523,659,784,1047].forEach((f,k)=>tone(f,.25,k*.1,'sine',.2))}
function buzz(){tone(220,.18,0,'square',.1);tone(165,.3,.2,'square',.1)}
function win(){
  if(!redoing){wins++;score+=tries===0?3:tries===1?2:1}
  const pr=PRAISE[Math.floor(Math.random()*PRAISE.length)];setMsg(pr+' 🎉','ok');if(snd){speak(pr,.85,true)}
  ['tip','manual','mic'].forEach(x=>$(x).classList.add('hide'));
  $('next').classList.remove('hide');$('redo').classList.remove('hide');redoing=false;
  $('next').textContent=i===cards.length-1?'شوف النتيجة':'الكلمة الجاية';
  $('fill').style.width=((i+1)/cards.length*100)+'%';
}
function tip(){$('tip').textContent='💡 '+(tries<=1&&TIP[L]?TIP[L]:GEN[(tries-1)%GEN.length]);$('tip').classList.remove('hide')}
function miss(heard){
  if(redoing){redoing=false;setMsg('تمام، كمّل أو أعدها','');$('mic').classList.add('hide');$('next').classList.remove('hide');$('redo').classList.remove('hide');return}
  tries++;
  setMsg(heard?'سمعتك قلت: '+heard+' ('+Math.round(lastSc*100)+'%)':'ما سمعتك منيح، جرّب مرة ثانية','no');
  tip();
  if(snd)buzz();
  if(tries>=3){$('manual').classList.remove('hide');$('yes').onclick=()=>{tries=2;win()}}
}
function lev(a,b){const m=[...a],n=[...b];let p=Array.from({length:n.length+1},(_,k)=>k);for(let x=1;x<=m.length;x++){const c=[x];for(let y=1;y<=n.length;y++)c[y]=Math.min(p[y]+1,c[y-1]+1,p[y-1]+(m[x-1]===n[y-1]?0:1));p=c}return p[n.length]}
function sim(a,b){const L=Math.max([...a].length,[...b].length);return L?1-lev(a,b)/L:0}
let lastSc=0;
function judge(alts){const t=norm(cards[i].w);let best=0;alts.forEach(a=>norm(a).split(' ').forEach(w=>{[w,w.replace(/^ال/,'')].forEach(v=>{if(v)best=Math.max(best,sim(v,t))})}));lastSc=best;return best>=.5}
async function listenNative(){
  const R=nat('SpeechRecognition');
  try{
    const p=await R.requestPermissions();
    if(p.speechRecognition!=='granted'){srOK=false;$('manual').classList.remove('hide');$('yes').onclick=win;setMsg('لازم تسمح للمايك من إعدادات التطبيق.','no');return}
    busy=true;$('mic').classList.add('live');setMsg('عم أسمعك… قول الكلمة','');
    const r=await R.start({language:'ar-SA',maxResults:5,prompt:'',partialResults:false,popup:false});
    busy=false;$('mic').classList.remove('live');
    const alts=(r&&r.matches)||[];
    if(!alts.length)miss('');else judge(alts)?win():miss(alts[0]);
  }catch(e){busy=false;$('mic').classList.remove('live');miss('')}
}
function listen(){
  if(busy)return;
  if(nat('SpeechRecognition'))return listenNative();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){srOK=false;$('manual').classList.remove('hide');$('yes').onclick=win;setMsg('جهازك ما بدعم التعرف على الصوت. قيّم بنفسك.','');return}
  const rec=new SR();rec.lang='ar-SA';rec.maxAlternatives=5;rec.interimResults=false;
  busy=true;$('mic').classList.add('live');setMsg('عم أسمعك… قول الكلمة','');
  let got=false;
  rec.onresult=e=>{got=true;const alts=[...e.results[0]].map(r=>r.transcript);judge(alts)?win():miss(alts[0])};
  rec.onerror=e=>{got=true;
    if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){srOK=false;$('manual').classList.remove('hide');$('yes').onclick=win;setMsg('المايك مش متاح هون. قيّم نفسك بالأزرار.','no')}
    else miss('')};
  rec.onend=()=>{busy=false;$('mic').classList.remove('live');if(!got)miss('')};
  try{rec.start()}catch(e){busy=false;$('mic').classList.remove('live')}
}
function finish(){
  const max=cards.length*3,st=score>=max*.8?3:score>=max*.5?2:1;
  if(mode===3||!done[L]||st>done[L])done[L]=Math.max(done[L]||0,st);
  $('stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('sum').textContent='نجحت بـ '+wins+' من '+cards.length+' بطاقات، ونقاطك '+score+' من '+max+'.';
  show('s4');
}
$('mic').onclick=listen;
$('hear').onclick=()=>speak(cards[i].w,.6,true);
$('hearL').onclick=()=>speak(L+'\u064E',.6,true);
$('redo').onclick=()=>{redoing=true;['next','redo'].forEach(x=>$(x).classList.add('hide'));$('mic').classList.remove('hide');setMsg('اضغط المايك وأعدها','')};
$('snd').onclick=()=>{snd=!snd;$('snd').textContent=snd?'🔊 صوت':'🔇 صامت';if(!snd){try{speechSynthesis.cancel()}catch(e){}}};
$('yes').onclick=win;
$('again').onclick=()=>{tries++;setMsg('تمام، جرّب مرة ثانية','');tip()};
$('next').onclick=()=>{i===cards.length-1?finish():(i++,render())};
$('b2').onclick=()=>{grid();show('s1')};
$('b3').onclick=()=>{grid();show('s1')};
$('home').onclick=()=>{grid();show('s1')};
$('again2').onclick=()=>start(mode);
grid();
if('serviceWorker' in navigator&&!window.Capacitor&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
